d matches?</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='193' x='393.5' y='207.9648'>(any failure: same generic 401)</text><polygon fill='#181818' points='625.5,251.0176,635.5,255.0176,625.5,259.0176,629.5,255.0176' style='stroke:#181818;stroke-width:1.0;'/><line style='stroke:#181818;stroke-width:1.0;' x1='386.5' x2='631.5' y1='255.0176' y2='255.0176'/><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='193' x='393.5' y='250.2754'>store SHA-256(OTP), TTL 300s</text><polygon fill='#181818' points='718,280.3281,728,284.3281,718,288.3281,722,284.3281' style='stroke:#181818;stroke-width:1.0;'/><line style='stroke:#181818;stroke-width:1.0;' x1='386.5' x2='724' y1='284.3281' y2='284.3281'/><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='165' x='393.5' y='279.5859'>email the 6-character OTP</text><polygon fill='#181818' points='52.5,324.9492,42.5,328.9492,52.5,332.9492,48.5,328.9492' style='stroke:#181818;stroke-width:1.0;'/><line style='stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;' x1='46.5' x2='385.5' y1='328.9492' y2='328.9492'/><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='175' x='58.5' y='308.8965'>challenge token (5 min JWT,</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='265' x='58.5' y='324.207'>purpose=2fa_challenge, fingerprint claim)</text><polygon fill='#181818' points='374.5,369.5703,384.5,373.5703,374.5,377.5703,378.5,373.5703' style='stroke:#181818;stroke-width:1.0;'/><line style='stroke:#181818;stroke-width:1.0;' x1='41.5' x2='380.5' y1='373.5703' y2='373.5703'/><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='209' x='48.5' y='353.5176'>POST /api/v1/authentication/2fa</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='294' x='48.5' y='368.8281'>{challenge token, OTP} + X-Device-Fingerprint</text><line style='stroke:#181818;stroke-width:1.0;' x1='386.5' x2='428.5' y1='418.1914' y2='418.1914'/><line style='stroke:#181818;stroke-width:1.0;' x1='428.5' x2='428.5' y1='418.1914' y2='431.1914'/><line style='stroke:#181818;stroke-width:1.0;' x1='387.5' x2='428.5' y1='431.1914' y2='431.1914'/><polygon fill='#181818' points='397.5,427.1914,387.5,431.1914,397.5,435.1914,393.5,431.1914' style='stroke:#181818;stroke-width:1.0;'/><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='142' x='393.5' y='398.1387'>verify purpose claim +</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='175' x='393.5' y='413.4492'>fingerprint claim == header</text><polygon fill='#181818' points='625.5,471.8125,635.5,475.8125,625.5,479.8125,629.5,475.8125' style='stroke:#181818;stroke-width:1.0;'/><line style='stroke:#181818;stroke-width:1.0;' x1='386.5' x2='631.5' y1='475.8125' y2='475.8125'/><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='227' x='393.5' y='455.7598'>validate OTP hash (max 5 attempts),</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='188' x='393.5' y='471.0703'>delete on success (single use)</text><path d='M287,490.8125 L574,490.8125 L574,498.123 L564,508.123 L287,508.123 L287,490.8125 ' fill='#EEEEEE' style='stroke:#000000;stroke-width:1.5;'/><rect fill='none' height='106.5527' style='stroke:#000000;stroke-width:1.5;' width='754.5' x='287' y='490.8125'/><text fill='#000000' font-family='sans-serif' font-size='13' font-weight='bold' lengthAdjust='spacing' textLength='242' x='302' y='504.3809'>establishSession (shared mint path)</text><polygon fill='#181818' points='966.5,540.7441,976.5,544.7441,966.5,548.7441,970.5,544.7441' style='stroke:#181818;stroke-width:1.0;'/><line style='stroke:#1