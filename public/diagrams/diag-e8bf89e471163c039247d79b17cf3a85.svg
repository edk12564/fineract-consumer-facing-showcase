;' x1='386.5' x2='972.5' y1='881.7363' y2='881.7363'/><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='208' x='393.5' y='876.9941'>KYC live check again (every mint)</text><polygon fill='#181818' points='52.5,907.0469,42.5,911.0469,52.5,915.0469,48.5,911.0469' style='stroke:#181818;stroke-width:1.0;'/><line style='stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;' x1='46.5' x2='385.5' y1='911.0469' y2='911.0469'/><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='321' x='58.5' y='906.3047'>new access_token + rotated refresh_token cookies</text></g></svg>